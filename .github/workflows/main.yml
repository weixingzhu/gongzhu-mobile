name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython

      - name: Unlock all permissions
        run: |
          # 提前创建并彻底打开 buildozer 的所有权限，防止缓存无法创建
          sudo mkdir -p /home/runner/.buildozer
          sudo chmod -R 777 /home/runner/.buildozer

      - name: Build with Buildozer
        run: |
          export ANDROIDSDK="/usr/local/lib/android/sdk"
          export ANDROIDNDK="/usr/local/lib/android/sdk/ndk/27.3.13750724"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gongzhu-apk
          path: bin/*.apk
