name: Build Kivy APK with Docker (AUTO-YES)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 核心魔法：强制在 Docker 内部疯狂输出 "y"，接受所有许可！
      - name: Run Buildozer inside Docker with Auto-Yes
        run: |
          yes | docker run -i --rm -v "$PWD":/home/user/hostcwd kivy/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gongzhu-apk
          path: bin/*.apk
