name: Build APK (Direct)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build the missing tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk
          cd /tmp
          git clone https://github.com/gnu-mirror-unofficial/libtool.git libtool-fix
          cd libtool-fix
          ./bootstrap
          ./configure
          make
          sudo make install
          cd $GITHUB_WORKSPACE
          pip install cython
          pip install git+https://github.com/kivy/python-for-android.git
          p4a apk --private . --package=org.example.gongzhu --name="拱猪" --version=0.1 --bootstrap=sdl2 --requirements=python3,kivy,pyjnius,plyer,pillow --arch=arm64-v8a --arch=armeabi-v7a --android-api=34 --ndk-api=21 --icon=icon.png

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gongzhu-apk
          path: ./*.apk
