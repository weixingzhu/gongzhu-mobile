name: Build Kivy APK with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 在本地电脑（runner）上用最高权限创建同意书
      - name: Pre-accept SDK Licenses
        run: |
          sudo mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          sudo bash -c 'echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license'
          sudo bash -c 'echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license'
          sudo chmod -R 777 /home/runner/.buildozer

      # 把同意书“打包”进 Docker 容器里
      - name: Run Buildozer inside Docker
        run: |
          docker run --rm -v "$PWD":/home/user/hostcwd -v "/home/runner/.buildozer":/home/user/.buildozer kivy/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gongzhu-apk
          path: bin/*.apk
